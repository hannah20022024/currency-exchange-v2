openapi: 3.0.0
info: 
  title: Users API
  version: 1.0.0
paths:
  /users:
    get:
      summary: Get user information and their watchlist
      responses:
        '200':
          description: Returns user information (excluding password)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  email:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
    post:
      summary: Create a new user
      requestBody:
        description: Provide details for the new user
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  email:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
    delete:
      summary: Delete a user
      parameters:
        - name: id
          in: query
          description: The ID of the user to delete
          required: true
          schema:
            type: string
      responses:
        '204':
          description: User deleted successfully
        '404':
          description: User not found
        '400':
          description: Invalid request, possibly missing `id` parameter
